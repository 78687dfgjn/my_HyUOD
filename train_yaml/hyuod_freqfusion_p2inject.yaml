# Ultralytics YOLO 🚀, AGPL-3.0 license
# HyUOD A+B: FreqFusion P4 -> P3, followed by MFDA P2 detail injection.

# Parameters
ch: 9
nc: 80 # overridden by the dataset configuration during training
scales: # [depth, width, max_channels]; the repository defaults to s
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Original B backbone, unchanged (layers 0-29).
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Input_agent, []]                    # 0
  - [0, 1, t_head, [64]]                       # 1
  - [0, 1, A_head, [32]]                       # 2
  - [0, 1, First_Conv, [64, 3, 2]]             # 3, P1/2

  - [1, 1, t_block, [64]]                      # 4
  - [2, 1, A_block, [64, 1]]                   # 5
  - [-3, 1, Conv, [128, 3, 2]]                 # 6, P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]          # 7
  - [[-1, -4, -3], 1, Concat, [1]]             # 8
  - [-1, 1, frequent_block, [256, 0.25]]       # 9, MFDA P2

  - [-6, 1, t_block, [128]]                    # 10
  - [2, 1, A_block, [64, 2]]                   # 11
  - [-3, 1, Conv, [256, 3, 2]]                 # 12, P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]          # 13
  - [[-1, -4, -3], 1, Concat, [1]]             # 14
  - [-1, 1, frequent_block, [512, 0.25]]       # 15, MFDA P3

  - [-6, 1, t_block, [256]]                    # 16
  - [2, 1, A_block, [64, 3]]                   # 17
  - [-3, 1, Conv, [512, 3, 2]]                 # 18, P4/16
  - [-1, 2, C3k2, [512, True]]                 # 19
  - [[-1, -4, -3], 1, Concat, [1]]             # 20
  - [-1, 1, frequent_block, [512]]             # 21, MFDA P4

  - [-6, 1, t_block, [512]]                    # 22
  - [2, 1, A_block, [64, 4]]                   # 23
  - [-3, 1, Conv, [1024, 3, 2]]                # 24, P5/32
  - [-1, 2, C3k2, [1024, True]]                # 25
  - [[-1, -4, -3], 1, Concat, [1]]             # 26
  - [-1, 1, frequent_block, [1024]]            # 27
  - [-1, 1, SPPF, [1024, 5]]                  # 28
  - [-1, 2, C2PSA, [1024]]                    # 29

head:
  # P5 -> P4, unchanged from B.
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 30
  - [[-1, 21], 1, Concat, [1]]                 # 31
  - [-1, 2, C3k2, [512, False]]                # 32, P4 head

  # B: HR backbone P3 first, LR head P4 second.
  - [[15, 32], 1, FreqFusionConcat, [64]]       # 33
  - [-1, 2, C3k2, [256, False]]                # 34, B P3

  # A: inject MFDA P2 detail into the B-enhanced P3.
  - [9, 1, SCDown, [256, 3, 2]]                # 35, P2/4 -> P3/8
  - [[-1, 34], 1, Concat, [1]]                 # 36
  - [-1, 1, C3k2, [256, False, 0.25]]          # 37, A+B P3/8

  # Original bottom-up PAN.
  - [-1, 1, Conv, [256, 3, 2]]                 # 38
  - [[-1, 32], 1, Concat, [1]]                 # 39
  - [-1, 2, C3k2, [512, False]]                # 40, P4/16
  - [-1, 1, Conv, [512, 3, 2]]                 # 41
  - [[-1, 29], 1, Concat, [1]]                 # 42
  - [-1, 2, C3k2, [1024, True]]                # 43, P5/32
  - [[37, 40, 43], 1, Detect, [nc]]            # 44, three detection scales
